<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coming Soon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
:root{--bg:#f2efe6;--ink:#1d2a44;--accent:#ff5a36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--ink:#f2efe6;--accent:#ff7a59}}
:root[data-theme="dark"]{--bg:#141a2b;--ink:#f2efe6;--accent:#ff7a59}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:24px;font-family:'Bricolage Grotesque',Georgia,sans-serif}
h1{font-weight:800;font-size:clamp(3rem,16vw,10rem);line-height:.9;letter-spacing:-.03em;margin:0;text-align:center}
h1 span{display:block;color:var(--accent)}
#cd{display:flex;gap:clamp(12px,4vw,36px);text-align:center}
#cd div{min-width:64px}
#cd b{display:block;font-size:clamp(2rem,10vw,4.5rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#cd small{font-size:clamp(.8rem,3vw,1.1rem);opacity:.75}
#when{margin:0;opacity:.8;text-align:center}
.ft{margin:0 0 -16px;font-size:clamp(1.2rem,5vw,1.8rem);font-weight:800;letter-spacing:.12em;text-align:center;color:var(--accent)}
.features{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.features li{border:2px solid var(--ink);border-radius:8px;padding:12px 20px;font-weight:800;font-size:clamp(1rem,4vw,1.4rem);background:linear-gradient(100deg,var(--ink) 35%,var(--accent) 50%,var(--ink) 65%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 2.5s linear infinite,bob 3s ease-in-out infinite,glow 2s ease-in-out infinite}
.features li:nth-child(2){animation-delay:.6s,.6s,.6s}
@keyframes shine{to{background-position:-150% 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{border-color:var(--ink)}50%{border-color:var(--accent)}}
@media (prefers-reduced-motion:reduce){.features li{animation:none;-webkit-text-fill-color:var(--ink);background:none}}
body{position:relative;overflow:hidden}
body>*{position:relative;z-index:1}
body::before,body::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;background:var(--accent);animation:drift 14s ease-in-out infinite alternate}
body::before{width:45vmax;height:45vmax;top:-15vmax;left:-15vmax}
body::after{width:40vmax;height:40vmax;bottom:-15vmax;right:-12vmax;background:var(--ink);opacity:.18;animation-duration:18s}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.25)}}
h1{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
h1 span{display:block;animation:pulse 2.4s ease-in-out 1s infinite}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#cd{animation:fadein .8s .5s both}
#when{animation:fadein .8s .8s both}
.ft{animation:fadein .8s 1s both}
#s{animation:tickpop 1s ease-in-out infinite;color:var(--accent)}
@keyframes fadein{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes tickpop{0%{transform:scale(1.18)}60%,100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){body::before,body::after,h1,h1 span,#cd,#when,.ft,#s{animation:none}}
</style>
</head>
<body>
<h1>Coming <span>Soon.</span></h1>
<div id="cd" aria-live="off">
  <div><b id="d">00</b><small>Days</small></div>
  <div><b id="h">00</b><small>Hours</small></div>
  <div><b id="m">00</b><small>Minutes</small></div>
  <div><b id="s">00</b><small>Seconds</small></div>
</div>
<p id="when">Saturday, October 24, 11:00 PM</p>
<h2 class="ft">FEATURES</h2>
<ul class="features">
  <li>New SAM Viral</li>
  <li>All SAM Video Viral</li>
</ul>
<script>
var target=new Date('2026-10-24T23:00:00+08:00').getTime();
function p(n){return String(n).padStart(2,'0')}
function tick(){
  var t=target-Date.now();
  if(t<=0){document.getElementById('cd').innerHTML='<b>Launching now!</b>';return}
  document.getElementById('d').textContent=p(Math.floor(t/864e5));
  document.getElementById('h').textContent=p(Math.floor(t%864e5/36e5));
  document.getElementById('m').textContent=p(Math.floor(t%36e5/6e4));
  document.getElementById('s').textContent=p(Math.floor(t%6e4/1e3));
  setTimeout(tick,1000);
}
tick();
</script>
</body>
</html>
