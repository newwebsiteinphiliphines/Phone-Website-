<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gangster Zone</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--fg:#f2f2f2;--gold:#d9d9d9;--red:#555;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f2f2f2}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Permanent Marker','Impact',sans-serif;overflow-x:hidden}
/* BACKGROUND: image 1 goes into --bg-image (kung naa), kung wala gradient fallback */
#bg{position:fixed;inset:0;z-index:0;background:#000;animation:pan 25s ease-in-out infinite alternate}
@keyframes pan{from{transform:scale(1.05) translateX(-1%)}to{transform:scale(1.15) translateX(1%)}}
#shade{position:fixed;inset:0;z-index:1;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.8));pointer-events:none}
#smoke{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.puff{position:absolute;bottom:-120px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) scale(2.2);opacity:0}}
/* DECORATIONS: image 2 floats around */
.deco{position:fixed;z-index:3;width:clamp(70px,20vw,150px);height:auto;pointer-events:none;filter:grayscale(1) contrast(1.1) drop-shadow(0 0 10px rgba(0,0,0,.9));opacity:.92;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.deco.float{animation-name:float}.deco.wobble{animation-name:wobble}.deco.pulse{animation-name:pulse2}
@keyframes float{50%{transform:translateY(-22px) rotate(5deg)}}
@keyframes wobble{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg) scale(1.07)}}
@keyframes pulse2{50%{transform:scale(1.15) rotate(-3deg)}}
main{position:relative;z-index:6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
h1{font-family:'UnifrakturCook','Old English Text MT',serif;font-size:clamp(2.8rem,14vw,7.5rem);letter-spacing:2px;margin:0;color:var(--gold);
 text-shadow:3px 3px 0 var(--red),6px 6px 0 #000,0 0 30px rgba(255,255,255,.35);animation:glitch 3s infinite}
@keyframes glitch{0%,92%,100%{transform:translate(0)}94%{transform:translate(-4px,2px) skewX(6deg)}96%{transform:translate(4px,-2px) skewX(-6deg)}}
.tag{font-size:clamp(1rem,4.5vw,1.8rem);margin:12px 0 36px;color:#fff;animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.55}}
.btn{display:inline-block;font-family:'UnifrakturCook','Old English Text MT',serif;font-size:clamp(1.5rem,6.5vw,2.4rem);letter-spacing:2px;color:#000;background:var(--gold);
 padding:16px 40px;border:4px solid #000;border-radius:6px;text-decoration:none;box-shadow:6px 6px 0 var(--red);
 transition:transform .15s,box-shadow .15s;animation:pulse 1.8s infinite}
.btn:hover,.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--red)}
@keyframes pulse{50%{box-shadow:6px 6px 0 var(--red),0 0 28px 6px rgba(255,255,255,.5)}}
.note{margin-top:22px;font-size:.9rem;opacity:.7}
.tape{position:fixed;left:-10%;width:120%;z-index:4;background:var(--gold);color:#000;font-family:'UnifrakturCook','Old English Text MT',serif;letter-spacing:3px;font-size:1.2rem;padding:4px 0;white-space:nowrap;overflow:hidden;pointer-events:none}
.tape span{display:inline-block;animation:marq 18s linear infinite}
.t1{top:3%;transform:rotate(-3deg)}
.t2{bottom:3%;transform:rotate(2deg)}
@keyframes marq{to{transform:translateX(-50%)}}
#bg img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
/* ---------- Extra sections ---------- */
section{
  position:relative;
  z-index:6;
  max-width:900px;
  margin:0 auto;
  padding:70px 20px;
  text-align:center;
}
h2{
  font-family:'UnifrakturCook','Old English Text MT',serif;
  font-size:clamp(2rem,9vw,3.6rem);
  margin:0 0 18px;
  color:var(--gold);
  text-shadow:3px 3px 0 #000;
}
section p{
  font-size:clamp(1rem,4vw,1.3rem);
  line-height:1.6;
  color:#cfcfcf;
  background:rgba(0,0,0,.55);
  padding:14px 18px;
  border-left:5px solid var(--gold);
  border-radius:4px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:18px;
  margin-top:24px;
}
.card{
  background:rgba(20,20,20,.85);
  border:3px solid #777;
  border-radius:8px;
  padding:22px 16px;
  transition:transform .25s,border-color .25s,background .25s;
}
.card:hover{
  transform:translateY(-8px) rotate(-1.5deg);
  border-color:#fff;
  background:rgba(45,45,45,.9);
}
.card b{
  display:block;
  font-family:'UnifrakturCook',serif;
  font-size:2.4rem;
  color:#fff;
}
.card span{color:#bbb;font-size:.95rem}
.stats{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:30px;
  margin-top:20px;
}
.stat{min-width:120px}
.stat strong{
  display:block;
  font-family:'UnifrakturCook',serif;
  font-size:3.2rem;
  color:#fff;
  text-shadow:0 0 18px rgba(255,255,255,.35);
}
.stat span{color:#aaa;letter-spacing:2px;text-transform:uppercase;font-size:.8rem}
.reveal{
  opacity:0;
  transform:translateY(40px);
  transition:opacity .8s ease,transform .8s ease;
}
.reveal.show{opacity:1;transform:none}
footer{
  position:relative;
  z-index:6;
  text-align:center;
  padding:30px 16px 50px;
  color:#888;
  font-size:.9rem;
  background:linear-gradient(transparent,#000 60%);
}
.divider{
  height:6px;
  width:min(300px,70%);
  margin:0 auto 10px;
  background:repeating-linear-gradient(45deg,#ddd 0 12px,#111 12px 24px);
  border-radius:3px;
}
</style>
</head>
