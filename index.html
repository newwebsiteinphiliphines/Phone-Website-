<style>
:root{
  --bg1:#000000;--bg2:#000000;--card:#000000;--border:rgba(255,255,255,.22);
  --text:#f3f4fb;--muted:#a9aecb;--a:#ff3b57;--b:#7c4dff;--c:#00e5ff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--text);font-family:"Rajdhani","Segoe UI",system-ui,-apple-system,sans-serif;font-size:1.05rem;background-color:#000;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));overflow-x:hidden;position:relative}
.orb{display:none;position:fixed;border-radius:50%;filter:blur(70px);opacity:.22;z-index:0;animation:float 12s ease-in-out infinite}
.o1{width:300px;height:300px;background:var(--b);top:-80px;left:-80px}
.o2{width:260px;height:260px;background:var(--a);bottom:-60px;right:-60px;animation-delay:-4s}
.o3{width:200px;height:200px;background:var(--c);top:45%;left:60%;animation-delay:-8s;opacity:.12}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:28px 18px 40px}
.hero{text-align:center;padding:18px 0 8px}
.badge{font-family:"Bebas Neue",Impact,sans-serif;display:inline-block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;padding:6px 14px;border:1px solid var(--border);border-radius:99px;background:var(--card);color:var(--muted)}
.logo-img{display:block;width:260px;max-width:85%;height:auto;margin:20px auto 10px;border-radius:18px;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,255,255,.25))}50%{filter:drop-shadow(0 0 22px rgba(255,255,255,.7))}}
.logo-old{width:96px;height:96px;margin:22px auto 14px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:44px;
  background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 0 0 rgba(255,59,87,.6);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 26px rgba(255,59,87,0)}100%{box-shadow:0 0 0 0 rgba(255,59,87,0)}}
h1{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.04em;font-size:2.7rem;line-height:1.05;margin:6px 0 10px;background:linear-gradient(90deg,#fff,#7d7d7d,#fff,#7d7d7d);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.sub{color:var(--muted);margin:0 0 22px;line-height:1.5}
.btn{position:relative;display:block;width:100%;padding:18px;border-radius:18px;text-align:center;text-decoration:none;color:#fff;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;letter-spacing:.08em;font-size:1.7rem;
  background:#000;border:2px solid #fff;overflow:hidden;box-shadow:0 0 22px rgba(255,255,255,.35);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sweep 2.8s infinite}
@keyframes sweep{to{left:130%}}
.copy{font-family:inherit;display:block;width:100%;margin-top:12px;padding:13px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.95rem;cursor:pointer}
.panel{margin-top:26px;padding:22px 18px;border-radius:22px;border:1px solid var(--border);background:var(--card);}
.panel h2{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;letter-spacing:.05em;margin:0 0 16px;font-size:1.7rem}
.step{display:flex;gap:14px;margin-bottom:16px;opacity:0;transform:translateY(14px);animation:rise .6s forwards}
.step:nth-child(2){animation-delay:.15s}.step:nth-child(3){animation-delay:.3s}.step:nth-child(4){animation-delay:.45s}.step:nth-child(5){animation-delay:.6s}
@keyframes rise{to{opacity:1;transform:none}}
.num{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:#000;border:2px solid #fff}
.step b{display:block;margin-bottom:2px}
.step span{color:var(--muted);font-size:.92rem;line-height:1.45}
details{border-top:1px solid var(--border);padding:12px 0}
summary{cursor:pointer;font-weight:600}
details p{color:var(--muted);font-size:.92rem;line-height:1.5;margin:8px 0 0}
.foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:24px}
</style>
</head>
