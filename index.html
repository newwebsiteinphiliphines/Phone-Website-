<style>
  :root {
    --bg: #0e0b0a; --card: #181818; --border: #4a2e17;
    --text: #f2f2f2; --muted: #9a9a9a;
    --orange1: #ff8c00; --orange2: #ff5a00; --accent: #ffa040; --borderhi: #8a4a12; --glow: 255,120,0; --g1: #c864d0; --g2: #ff4d88;
  }

  :root[data-theme="purple"] { --orange1: #a855f7; --orange2: #6d28d9; --accent: #c4a1ff; --borderhi: #5b3a9a; --border: #33224f; --glow: 150,90,255; --g1: #7aa2ff; --g2: #c864d0; }
  :root[data-theme="green"]  { --orange1: #4ade80; --orange2: #15a34a; --accent: #7dffa8; --borderhi: #1f7a42; --border: #173a26; --glow: 60,220,110; --g1: #b6ff5c; --g2: #2dd4bf; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #251830 0%, var(--bg) 60%);
    color: var(--text);
    font-family: Roboto, "Segoe UI", system-ui, sans-serif;
    font-size: 14px; position: relative; overflow-x: hidden;
  }
  /* lightning flicker */
  body::before {
    content: ""; position: fixed; inset: 0; background: #b9a6ff; opacity: 0;
    pointer-events: none; z-index: 1; animation: flash 11s infinite;
  }
  @keyframes flash {
    0%, 92%, 96%, 100% { opacity: 0; }
    93% { opacity: .13; } 94% { opacity: .02; } 95% { opacity: .1; }
  }
  header {
    position: relative; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-bottom: 1px solid #2a2a2a; background: rgba(10,10,10,.75);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: .95rem; }
  #logoBtn {
    width: 34px; height: 34px; border-radius: 9px; overflow: hidden; cursor: default; pointer-events: none;
    border: 2px solid #f5a623; background: #f5a623; display: grid; place-items: center;
    font-size: 18px; padding: 0; flex: none; animation: bob 3s ease-in-out infinite;
  }
  #logoBtn img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes bob { 50% { transform: translateY(-2px) rotate(-4deg); } }
  .pumpkin-title { display: inline-block; animation: wiggle 2.2s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

  .menu-wrap { position: relative; }
  .menu {
    width: 38px; height: 38px; border-radius: 11px; border: 1px solid #333;
    background: rgba(255,255,255,.05); display: grid; place-items: center; cursor: pointer; color:#fff;
  }
  .menu span, .menu span::before, .menu span::after {
    display: block; width: 16px; height: 2px; background: #fff; border-radius: 2px; position: relative; content: "";
  }
  .menu span::before { position: absolute; top: -5px; }
  .menu span::after { position: absolute; top: 5px; }
  .dropdown {
    display: none; position: absolute; right: 0; top: 44px; min-width: 190px; z-index: 20;
    background: #1b1b1b; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.6);
  }
  .dropdown.show { display: block; animation: pop .15s ease; }
  .dropdown button {
    display: block; width: 100%; text-align: left; background: none; border: 0; color: #ddd;
    padding: 11px 14px; font-size: .85rem; cursor: pointer; border-bottom: 1px solid #262626;
  }
  .dropdown button:last-child { border-bottom: 0; }
  .dropdown button:hover { background: #2a1d10; color: var(--accent); }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } }

  /* floating decorations */
  .deco { position: fixed; pointer-events: none; z-index: 2; }
  .ghost { top: 90px; left: 10px; font-size: 1.8rem; animation: ghostFloat 6s ease-in-out infinite; filter: drop-shadow(0 0 8px rgba(255,255,255,.5)); }
  @keyframes ghostFloat {
    0%,100% { transform: translate(0,0) rotate(-6deg); opacity: .9; }
    25% { transform: translate(30px,-14px) rotate(4deg); opacity: .5; }
    50% { transform: translate(10px,-26px) rotate(-3deg); opacity: .95; }
    75% { transform: translate(-6px,-10px) rotate(6deg); opacity: .6; }
  }
  .bat { font-size: 1.4rem; top: 100px; left: -40px; animation: batFly 9s linear infinite; }
  .bat.b2 { top: 160px; font-size: 1rem; animation-duration: 13s; animation-delay: 3s; }
  .bat.b3 { top: 60px; font-size: 1.2rem; animation-duration: 11s; animation-delay: 6s; }
  @keyframes batFly {
    0% { transform: translate(0,0) scaleX(1); }
    25% { transform: translate(28vw,-24px) scaleX(.8); }
    50% { transform: translate(55vw,18px) scaleX(1); }
    75% { transform: translate(80vw,-18px) scaleX(.8); }
    100% { transform: translate(115vw,10px) scaleX(1); }
  }
  .spider-wrap { position: fixed; top: 0; left: 62%; z-index: 3; pointer-events: none; animation: spiderDrop 5s ease-in-out infinite; transform-origin: top; }
  .spider-wrap::before { content: ""; display: block; width: 1px; height: 60px; background: #888; margin: 0 auto; }
  .spider-wrap span { display: block; font-size: 1.3rem; text-align: center; }
  @keyframes spiderDrop { 0%,100% { transform: translateY(-22px) rotate(-3deg); } 50% { transform: translateY(34px) rotate(3deg); } }

  .falling { position: fixed; top: -30px; z-index: 2; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: .4; } }
  body.noanim .deco, body.noanim .falling, body.noanim .spider-wrap { display: none; }

  main { position: relative; z-index: 4; max-width: 340px; margin: 0 auto; padding: 22px 14px 50px; }
  h1 {
    text-align: center; font-size: 1.6rem; font-weight: 800;
    background: linear-gradient(90deg, var(--g1), var(--g2), var(--orange1), var(--g1));
    background-size: 300% 100%; animation: shimmer 5s linear infinite;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(255,80,140,.35));
  }
  @keyframes shimmer { to { background-position: 300% 0; } }
  .sub { text-align: center; color: var(--muted); font-size: .85rem; margin: 6px 0 20px; }

  .card {
    position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 18px 16px; animation: cardGlow 3s ease-in-out infinite;
  }
  @keyframes cardGlow {
    0%,100% { box-shadow: 0 0 18px rgba(var(--glow),.08); border-color: var(--border); }
    50% { box-shadow: 0 0 34px rgba(var(--glow),.28); border-color: var(--borderhi); }
  }
  .card .web { position: absolute; top: -10px; right: -6px; font-size: 1.5rem; animation: sway 4s ease-in-out infinite; transform-origin: top right; }
  @keyframes sway { 50% { transform: rotate(8deg); } }
  .card .pump { position: absolute; bottom: -14px; right: 10px; font-size: 1.5rem; animation: pumpGlow 1.8s ease-in-out infinite; }
  @keyframes pumpGlow {
    0%,100% { filter: drop-shadow(0 0 2px #ff8c00); transform: scale(1); }
    50% { filter: drop-shadow(0 0 14px #ffae00); transform: scale(1.12); }
  }

  .alert {
    display: none; border: 1px solid #6b2a20; background: #1a0f10; color: #ff4b3a;
    border-radius: 12px; padding: 12px 14px; font-size: .85rem; margin-bottom: 14px;
  }
  .alert.show { display: block; animation: shake .35s; }
  .alert.ok { color: #5dd67a; border-color: #1f5a30; background: #0f1a12; animation: pop .2s; }
  @keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
  label { font-weight: 600; font-size: .85rem; }
  .btn-small {
    background: #0e0e0e; border: 1px solid #3a3a3a; color: #aaa; border-radius: 9px;
    padding: 6px 10px; font-size: .75rem; font-weight: 600; cursor: pointer; transition: .15s;
  }
  .btn-small:hover { border-color: var(--orange1); color: var(--accent); }
  .input-wrap {
    display: flex; align-items: center; background: #0d0d0d; border: 1px solid #333;
    border-radius: 12px; padding: 6px 6px 6px 12px; transition: .2s;
  }
  .input-wrap input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #fff;
    font-family: "Courier New", monospace; font-size: .85rem;
  }
  .input-wrap input::placeholder { color: #666; }
  .input-wrap:focus-within { border-color: var(--orange1); box-shadow: 0 0 12px rgba(var(--glow),.3); }

  .go {
    width: 100%; margin-top: 16px; padding: 12px; border: 1px solid #ff9a2e; border-radius: 12px;
    background: linear-gradient(90deg, var(--orange1), var(--orange2)); background-size: 200% 100%;
    color: #fff; font-size: .9rem; font-weight: 700; cursor: pointer;
    animation: btnPulse 2s ease-in-out infinite; transition: background-position .4s;
  }
  .go:hover { background-position: 100% 0; }
  @keyframes btnPulse {
    0%,100% { box-shadow: 0 0 14px rgba(var(--glow),.3); }
    50% { box-shadow: 0 0 28px rgba(var(--glow),.65); }
  }
  .go:active { transform: scale(.98); }
  .foot { text-align: center; color: var(--muted); margin-top: 14px; font-size: .75rem; }
  .foot a { color: var(--muted); cursor: pointer; }

  #history { display: none; margin-top: 12px; border-top: 1px solid #2a2a2a; padding-top: 8px; max-height: 160px; overflow-y: auto; }
  #history.show { display: block; animation: pop .2s; }
  #history a {
    display: block; color: var(--accent); word-break: break-all; padding: 5px 0; font-size: .75rem;
    border-bottom: 1px dashed #2a2a2a; text-decoration: none;
  }
  #history .empty { color: var(--muted); font-size: .75rem; }
  #fileInput { display: none; }

  /* ---------- HUMAN VERIFICATION ---------- */
  #verify {
    position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
    background: rgba(5,3,8,.82); backdrop-filter: blur(4px); padding: 14px;
  }
  #verify.show { display: flex; animation: pop .2s; }
  .vbox {
    width: 100%; max-width: 340px; background: #fff; border-radius: 14px; padding: 22px 14px 14px;
    box-shadow: 0 0 40px rgba(var(--glow),.35); position: relative; text-align: center;
  }
  .vclose { position: absolute; top: 6px; right: 10px; background: none; border: 0; color: #999; font-size: 1.1rem; cursor: pointer; }
  .vicon { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; display: block; margin: 0 auto 18px;
           border: 2px solid var(--orange1); box-shadow: 0 0 14px rgba(var(--glow),.45); }
  .check-row {
    display: flex; align-items: center; gap: 12px; background: #f9f9f9; border: 2px solid #e2e2e2;
    padding: 12px 12px; cursor: pointer; text-align: left; user-select: none;
  }
  .check-row .box {
    width: 32px; height: 32px; border: 3px solid #dcdcdc; border-radius: 6px; background: #f3f3f3;
    display: grid; place-items: center; flex: none; transition: .2s; font-size: 20px; color: transparent;
  }
  .check-row .t { flex: 1; font-size: .98rem; color: #111; line-height: 1.15; }
  .check-row.loading .box { border-color: var(--orange1); border-top-color: transparent; border-radius: 50%; background: transparent; animation: spin .7s linear infinite; }
  .check-row.done .box { background: #2fbf5b; border-color: #2fbf5b; color: #fff; }
  .check-row.done { cursor: default; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .vbrandbox { text-align: right; flex: none; }
  .vbrandbox b { display: block; color: #111; font-size: .72rem; letter-spacing: .8px; font-weight: 800; }
  .vbrandbox small { color: #666; font-size: .62rem; }
  #challenge { display: none; margin-top: 12px; }
  #challenge.show { display: block; animation: pop .2s; }
  #challenge .go { margin-top: 0; }
  .vbox.shake { animation: shake .35s; }
  .countdown {
    display: block; width: fit-content; margin: -8px auto 16px; padding: 6px 14px; border-radius: 999px;
    background: rgba(0,0,0,.45); border: 1px solid var(--border); color: var(--accent);
    font-size: .78rem; font-weight: 600; letter-spacing: .2px; text-align: center;
  }
  .row2 { display: flex; gap: 10px; margin-top: 10px; }
  .row2 .btn-small { flex: 1; padding: 10px; font-size: .8rem; }
  .vol { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #262626; color: #ddd; font-size: .85rem; }
  .vol input { flex: 1; accent-color: var(--orange1); min-width: 0; }
</style>

  /* ---------- ICON ---------- */
  function setIcon(src) {
    logoBtn.innerHTML = '';
    const img = new Image();
    img.alt = 'icon';
    img.onerror = () => { logoBtn.textContent = '🧑'; };
    img.src = src;
    logoBtn.appendChild(img);
    favicon.href = src;
  }
  function loadIcon() { setIcon(DEFAULT_ICON); $('vIcon').src = DEFAULT_ICON; }   // icon is fixed — cannot be changed
  loadIcon();
  try { localStorage.removeItem('siteIcon'); } catch {}

  /* ---------- MENU ---------- */
  const dropdown = $('dropdown');
  function closeMenu() { dropdown.classList.remove('show'); }
  $('menuBtn').addEventListener('click', e => { e.stopPropagation(); dropdown.classList.toggle('show'); });
  document.addEventListener('click', e => { if (!dropdown.contains(e.target)) closeMenu(); });

  function applyAnim(on) {
    document.body.classList.toggle('noanim', !on);
    $('mAnim').textContent = '✨ Animations: ' + (on ? 'ON' : 'OFF');
  }
  let animOn = true;
  try { animOn = localStorage.getItem('anim') !== 'off'; } catch {}
  applyAnim(animOn);
  $('mAnim').addEventListener('click', () => {
    animOn = !animOn;
    try { localStorage.setItem('anim', animOn ? 'on' : 'off'); } catch {}
    applyAnim(animOn); closeMenu();
  });
  $('mClear').addEventListener('click', () => {
    try { localStorage.removeItem('linkHistory'); } catch {}
    renderHistory(); closeMenu(); showAlert('history cleared', true);
  });

  /* ---------- LINKS ---------- */
  function showAlert(msg, ok = false) {
    alertBox.className = 'alert';
    void alertBox.offsetWidth;                 // restart animation
    alertBox.textContent = msg;
    alertBox.className = 'alert show' + (ok ? ' ok' : '');
  }
  function normalize(raw) {
    let v = raw.trim();
    if (!v) return null;
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    try { const u = new URL(v); return u.hostname.includes('.') ? u.href : null; } catch { return null; }
  }
  function getHistory() {
    try { return JSON.parse(localStorage.getItem('linkHistory') || '[]'); } catch { return []; }
  }
  function saveHistory(link) {
    try {
      const h = [link, ...getHistory().filter(x => x !== link)].slice(0, 20);
      localStorage.setItem('linkHistory', JSON.stringify(h));
    } catch {}
  }
  function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function renderHistory() {
    const h = getHistory();
    historyBox.innerHTML = h.length
      ? h.map(l => `<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a>`).join('')
      : '<div class="empty">No history yet</div>';
  }

  function doOpen() {
    const link = normalize(PERMANENT_LINK);
    if (!link) return showAlert('invalid link');
    saveHistory(link);
    renderHistory();
    showAlert('opening link...', true);
    const a = document.createElement('a');
    a.href = link; a.target = '_blank'; a.rel = 'noopener noreferrer';
    document.body.appendChild(a); a.click(); a.remove();
  }
  function openLink() { showVerify(); }
  $('openBtn').addEventListener('click', openLink);
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') openLink(); });

  $('historyBtn').addEventListener('click', () => {
    renderHistory(); historyBox.classList.toggle('show');
  });
  $('backBtn').addEventListener('click', () => {
    alertBox.className = 'alert';
    historyBox.classList.remove('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  function showVerify() { resetVerify(); verifyEl.classList.add('show'); }
  function hideVerify() { verifyEl.classList.remove('show'); }
  checkRow.addEventListener('click', () => {
    if (busy || checkRow.classList.contains('done')) return;
    busy = true; checkRow.classList.add('loading'); $('chkText').textContent = 'Verifying...';
    setTimeout(() => {
      checkRow.className = 'check-row done'; $('chkText').textContent = 'Success!';

      ['B4',1],['D5',1],['F5',1],  ['E5',2],['D5',1],   ['C5',1],['B4',1],['G#4',1],  ['A4',2],[null,1],
      ['E5',1],['E5',1],['C5',1],  ['D5',2],['B4',1],   ['C5',1],['A4',1],['F4',1],   ['E4',2],['G#4',1],
      ['A4',1],['C5',1],['E5',1],  ['A5',1],['G#5',1],['E5',1], ['F5',2],['E5',1],    ['A4',3]
    ];
    const bass = ['A2','A2','E3','A2','F4','E3','A2','E3'];  // one per 3-beat bar (loops)
    const BEAT = 0.42;                                         // seconds per beat

    function init() {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.0; master.connect(ctx.destination);
      delay = ctx.createDelay(1); delay.delayTime.value = 0.38;
      fb = ctx.createGain(); fb.gain.value = 0.42;
      const wet = ctx.createGain(); wet.gain.value = 0.45;
      delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
      // low drone pad
      [N.A2, N.E3].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = i ? 6 : -6;
        lp.type = 'lowpass'; lp.frequency.value = 260; g.gain.value = 0.05;
        const lfo = ctx.createOscillator(), lg = ctx.createGain();
        lfo.frequency.value = 0.12 + i * 0.07; lg.gain.value = 0.03; lfo.connect(lg); lg.connect(g.gain); lfo.start();
        o.connect(lp); lp.connect(g); g.connect(master); o.start();
      });
    }
    function tone(freq, t, dur, type, vol, send) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master); if (send) g.connect(delay);
      o.start(t); o.stop(t + dur + 0.05);
    }
    function schedule() {
      while (nextTime < ctx.currentTime + 0.6) {
        const [n, beats] = melody[step % melody.length];
        if (n) {                                   // music-box: sine + soft octave
          tone(N[n], nextTime, 1.6, 'sine', 0.16, true);
          tone(N[n] * 2, nextTime, 0.7, 'triangle', 0.04, true);
        }
        if (step % melody.length === 0 || step === 0) {}
        nextTime += beats * BEAT; step++;
      }
    }
    // bass thump on each bar (every 3 beats) handled with its own clock
    let bassStep = 0, bassNext = 0;
    function scheduleBass() {
      while (bassNext < ctx.currentTime + 0.6) {
        const f = N[bass[bassStep % bass.length]] / (bass[bassStep % bass.length] === 'F4' ? 2 : 1);
        tone(f, bassNext, 1.1, 'triangle', 0.14, false);
        bassNext += 3 * BEAT; bassStep++;
      }
    }
    function start() {
      if (!ctx) init();
      ctx.resume();
      if (running) return;
      running = true; step = 0; bassStep = 0;
      nextTime = bassNext = ctx.currentTime + 0.15;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(vol * 1.3, ctx.currentTime, 0.4);
      timer = setInterval(() => { schedule(); scheduleBass(); }, 120);
    }
    function stop() {
      if (!ctx || !running) return;
      running = false; clearInterval(timer);
      master.gain.setTargetAtTime(0.0, ctx.currentTime, 0.15);
      setTimeout(() => { if (!running) ctx.suspend(); }, 800);
    }
    document.addEventListener('visibilitychange', () => {
      if (!ctx || !running) return;
      document.hidden ? ctx.suspend() : ctx.resume();
    });
    function setVolume(v) { vol = v; if (master && running) master.gain.setTargetAtTime(v * 1.3, ctx.currentTime, 0.08); }
    return { start, stop, setVolume, get on() { return running; }, get state() { return ctx ? ctx.state : 'none'; } };
  })();

  const mMusic = $('mMusic');
  function uiMusic() { mMusic.textContent = '🎵 Music: ' + (Music.on ? 'ON' : 'OFF'); }
  // Music is controlled only from the menu (Settings) button — never starts by itself.
  mMusic.addEventListener('click', e => {
    e.stopPropagation();
    Music.on ? Music.stop() : Music.start();
    uiMusic();
    closeMenu();
  });
  uiMusic();


  /* ---------- EXTRA FEATURES ---------- */
  // volume slider
  const volEl = $('vol');
  try { const v = localStorage.getItem('vol'); if (v !== null) volEl.value = v; } catch {}
  Music.setVolume(volEl.value / 100);
  volEl.addEventListener('input', () => {
    Music.setVolume(volEl.value / 100);
    try { localStorage.setItem('vol', volEl.value); } catch {}
  });

  // theme switcher
  const THEMES = [['orange', 'Orange'], ['purple', 'Purple'], ['green', 'Green']];
  let themeIdx = 0;
  try { const t = localStorage.getItem('theme'); const i = THEMES.findIndex(x => x[0] === t); if (i >= 0) themeIdx = i; } catch {}
  function applyTheme() {
    const [id, label] = THEMES[themeIdx];
    document.documentElement.setAttribute('data-theme', id);
    $('mTheme').textContent = '🎨 Theme: ' + label;
    try { localStorage.setItem('theme', id); } catch {}
  }
  $('mTheme').addEventListener('click', e => { e.stopPropagation(); themeIdx = (themeIdx + 1) % THEMES.length; applyTheme(); });
  applyTheme();

  // copy + share
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; } catch {}
    try {
      const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch { return false; }
  }
  $('copyBtn').addEventListener('click', async () => {
    showAlert((await copyText(PERMANENT_LINK)) ? 'link copied!' : 'could not copy', true);
  });
  $('shareBtn').addEventListener('click', async () => {
    if (navigator.share) {
      try { await navigator.share({ title: 'Bacon Site', url: PERMANENT_LINK }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    showAlert((await copyText(PERMANENT_LINK)) ? 'sharing not supported — link copied!' : 'could not share', true);
  });

  // Halloween countdown (auto-rolls to next year)
  function tickCountdown() {
    const now = new Date(), y = now.getFullYear();
    let start = new Date(y, 9, 31), end = new Date(y, 10, 1);
    const el = $('countdown');
    if (now >= start && now < end) { el.textContent = '🎃 Happy Halloween! 👻'; return; }
    if (now >= end) start = new Date(y + 1, 9, 31);
    let s = Math.floor((start - now) / 1000);
    const d = Math.floor(s / 86400); s -= d * 86400;
    const hh = Math.floor(s / 3600); s -= hh * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    const pad = n => String(n).padStart(2, '0');
    el.textContent = `🎃 Halloween in ${d}d ${pad(hh)}h ${pad(m)}m ${pad(s)}s`;
  }
  tickCountdown(); setInterval(tickCountdown, 1000);

  /* ---------- FALLING HALLOWEEN ---------- */
  const items = ['🎃','🍬','🍭','🍂','🦇','💀','🕸️','🍁'];
  function drop() {
    if (document.body.classList.contains('noanim') || document.hidden) return;
    const el = document.createElement('div');
    el.className = 'falling';
    el.textContent = items[Math.floor(Math.random() * items.length)];
    el.style.left = Math.random() * 96 + 'vw';
    el.style.fontSize = (14 + Math.random() * 14) + 'px';
    const dur = 7 + Math.random() * 7;
    el.style.animationDuration = dur + 's';
    el.style.opacity = .55 + Math.random() * .4;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000);
  }
  setInterval(drop, 1100);
</script>
</body>
</html>
