<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b12">
<title>NovaOS — App Hub</title>
<style>
:root{--bg:#090b12;--fg:#f6f7ff;--muted:#a5aac0;--glass:rgba(24,27,43,.76);--line:#ffffff20;--accent:#8b5cf6;--cyan:#35e6ff}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--fg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);overflow:hidden}
.wallpaper{position:fixed;inset:0;background:radial-gradient(ellipse at 12% 10%,#5330a6 0,transparent 38%),radial-gradient(ellipse at 90% 35%,#075b71 0,transparent 35%),radial-gradient(ellipse at 55% 100%,#31215b 0,transparent 42%),linear-gradient(140deg,#090b12,#101527 65%,#090b12);z-index:-2}
.wallpaper:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 96%,#ffffff06 96%);background-size:100% 5px;opacity:.22}
.shell{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);max-width:760px;margin:auto}
.status{height:37px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:750;padding:0 5px;text-shadow:0 2px 12px #000}.status-right{display:flex;gap:8px;align-items:center}.pill{background:#ffffff16;border:1px solid #ffffff14;border-radius:20px;padding:5px 9px}
.header{display:flex;align-items:center;justify-content:space-between;margin:17px 2px 22px}.greeting small{display:block;color:#c4c7dc;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.greeting h1{margin:4px 0 0;font-size:29px;letter-spacing:-1.4px}.avatar{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#35e6ff);font-size:21px;box-shadow:0 6px 30px #8b5cf650}
.search{display:flex;gap:10px;align-items:center;border:1px solid #ffffff20;background:#ffffff12;backdrop-filter:blur(20px);border-radius:17px;padding:13px 15px;margin-bottom:23px;color:#e7e9f5}.search input{border:0;outline:0;background:transparent;color:white;width:100%;font-size:14px}.search input::placeholder{color:#c0c4d5}
.label{display:flex;align-items:center;justify-content:space-between;margin:0 3px 15px;font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.label span{font-size:11px;color:#b7bbcf;font-weight:500;letter-spacing:0;text-transform:none}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 8px;overflow-y:auto;padding:5px 0 18px;scrollbar-width:none}.apps::-webkit-scrollbar{display:none}.app{border:0;background:transparent;color:var(--fg);display:flex;align-items:center;flex-direction:column;gap:8px;min-width:0;cursor:pointer;padding:0;transition:transform .16s}.app:active{transform:scale(.92)}.icon{width:clamp(54px,16vw,70px);height:clamp(54px,16vw,70px);border-radius:22px;display:grid;place-items:center;font-size:28px;box-shadow:0 10px 25px #0003;border:1px solid #ffffff25;position:relative;overflow:hidden}.icon:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff30,transparent 55%);pointer-events:none}.appname{font-size:11px;font-weight:650;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 9px #000}
.yt{background:linear-gradient(145deg,#ff5555,#cc001d)}.sp{background:linear-gradient(145deg,#4af09a,#087d4d)}.gpt{background:linear-gradient(145deg,#3d454c,#111820)}.tt{background:linear-gradient(145deg,#15151d,#353543)}.rb{background:linear-gradient(145deg,#f9fafb,#bfc6d2);color:#171923}.fb{background:linear-gradient(145deg,#48a3ff,#0754c6)}.ig{background:linear-gradient(135deg,#7b3cff,#ed3b9b,#ffb14a)}.google{background:linear-gradient(145deg,#fff,#dce6f5);color:#4285f4}.tool{background:linear-gradient(145deg,#575b75,#252a43)}
.widget{margin-top:auto;border:1px solid #ffffff20;background:linear-gradient(125deg,#ffffff17,#ffffff08);backdrop-filter:blur(20px);border-radius:23px;padding:17px;box-shadow:0 15px 45px #0002}.widgettop{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#c9cce0;letter-spacing:1.2px;text-transform:uppercase}.widgettop strong{color:#fff}.bigtime{font-size:35px;font-weight:750;letter-spacing:-1.5px;margin:7px 0 0}.date{font-size:12px;color:#c1c5d8}.dock{display:flex;justify-content:space-around;align-items:center;gap:12px;margin:17px auto 13px;padding:11px 14px;border-radius:26px;background:#ffffff1c;border:1px solid #ffffff24;backdrop-filter:blur(25px);width:min(100%,420px)}.dock button{border:0;color:white;background:#ffffff14;border-radius:15px;width:49px;height:49px;font-size:22px;cursor:pointer}.nav{height:15px;display:flex;justify-content:center;align-items:center;margin-bottom:4px}.nav:after{content:"";width:108px;height:4px;border-radius:5px;background:#ffffffbb}
.overlay{position:fixed;inset:0;background:#050710d9;backdrop-filter:blur(18px);z-index:10;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 15px calc(env(safe-area-inset-bottom) + 15px)}.overlay.open{display:flex}.bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{width:42px;height:42px;border:1px solid var(--line);background:#ffffff12;color:white;border-radius:14px;font-size:20px;cursor:pointer}.apphead{display:flex;align-items:center;gap:12px;flex:1}.apphead .icon{width:44px;height:44px;border-radius:14px;font-size:21px}.apphead strong{font-size:17px}.apphead small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.openexternal{border:0;background:linear-gradient(110deg,#8b5cf6,#5968e8);color:white;padding:12px 14px;border-radius:13px;font-weight:750;cursor:pointer}.content{flex:1;min-height:0;border:1px solid var(--line);border-radius:20px;background:#111522;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:23px}.info{max-width:400px}.info .emoji{font-size:46px;margin-bottom:15px}.info h2{margin:0 0 10px;font-size:23px}.info p{font-size:13px;color:#b6bdd2;line-height:1.7}.info .note{padding:12px;border-radius:13px;background:#ffffff0b;border:1px solid #ffffff12;font-size:12px;color:#d4d8e7;margin:15px 0}.info a{color:#8fefff}.hint{font-size:10px;color:#a8aec5;text-align:center;margin-top:12px}.toast{position:fixed;bottom:35px;left:50%;transform:translate(-50%,20px);opacity:0;background:#f5f6ff;color:#111827;border-radius:12px;padding:11px 15px;font-size:12px;z-index:20;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:600px){.shell{padding-left:28px;padding-right:28px}.apps{grid-template-columns:repeat(4,1fr);gap:28px}.icon{width:72px;height:72px}.appname{font-size:12px}}
</style>
</head>
<body>
<div class="wallpaper"></div>
<div class="shell">
  <div class="status"><span id="statusTime">9:41</span><div class="status-right"><span id="wifiIcon" title="Network status">◉ Wi-Fi</span><span id="signalIcon" title="Signal">▮▮▮</span><span class="pill" id="batteryPill" title="Battery level">▰ --%</span></div></div>
  <header class="header"><div class="greeting"><small>THURSDAY · YOUR SPACE</small><h1>Hey, welcome back.</h1></div><div class="avatar">✦</div></header>
  <label class="search"><span>⌕</span><input id="search" placeholder="Search your apps..." autocomplete="off"><span>⌘</span></label>
  <div class="label">Your apps <span id="appTotal">8 apps</span></div>
  <main class="apps" id="apps">
    <button class="app" data-name="youtube videos" data-app="YouTube"><span class="icon yt">▶</span><span class="appname">YouTube</span></button>
    <button class="app" data-name="spotify music" data-app="Spotify"><span class="icon sp">♫</span><span class="appname">Spotify</span></button>
    <button class="app" data-name="chatgpt ai assistant" data-app="ChatGPT"><span class="icon gpt">✳</span><span class="appname">ChatGPT</span></button>
    <button class="app" data-name="tiktok videos" data-app="TikTok"><span class="icon tt">♪</span><span class="appname">TikTok</span></button>
    <button class="app" data-name="roblox games" data-app="Roblox"><span class="icon rb">◇</span><span class="appname">Roblox</span></button>
    <button class="app" data-name="facebook social" data-app="Facebook"><span class="icon fb">f</span><span class="appname">Facebook</span></button>
    <button class="app" data-name="instagram photos reels" data-app="Instagram"><span class="icon ig">◎</span><span class="appname">Instagram</span></button>
    <button class="app" data-name="google chrome search browser" data-app="Google"><span class="icon google">G</span><span class="appname">Google</span></button>
  </main>
  <section class="widget"><div class="widgettop"><strong>✦ NOVA WIDGET</strong><span>LOCAL TIME</span></div><div class="bigtime" id="bigTime">--:--</div><div class="date" id="date">Loading date…</div></section>
  <nav class="dock"><button aria-label="YouTube" data-dock="YouTube">▶</button><button aria-label="Spotify" data-dock="Spotify">♫</button><button aria-label="ChatGPT" data-dock="ChatGPT">✳</button><button aria-label="Google" data-dock="Google">G</button></nav>
  <div class="nav"></div>
</div>
<section class="overlay" id="overlay" aria-modal="true" role="dialog" aria-label="App details">
  <div class="bar"><button class="back" id="back" aria-label="Back">‹</button><div class="apphead"><span class="icon tool" id="modalIcon">✦</span><div><strong id="modalTitle">App</strong><small>APP LAUNCHER</small></div></div><button class="openexternal" id="launch">Open ↗</button></div>
  <div class="content"><div class="info"><div class="emoji" id="infoEmoji">📱</div><h2 id="infoTitle">Open app</h2><p id="infoText"></p><div class="note" id="infoNote"></div></div></div>
  <div class="hint">Some apps block embedding for security. Use Open ↗ to launch the official site.</div>
</section>
<div class="toast" id="toast"></div>
<script>
const apps={
"YouTube":{url:"https://www.youtube.com/",emoji:"▶️",cls:"yt",icon:"▶",text:"Watch videos, channels, Shorts, and live streams.",note:"YouTube videos can often be embedded individually, but the full YouTube app cannot be cloned inside this page.",embed:"limited"},
"Spotify":{url:"https://open.spotify.com/",emoji:"♫",cls:"sp",icon:"♫",text:"Listen to music, playlists, podcasts, and more.",note:"Some Spotify tracks, albums, and playlists support official embedded players. Full account features still need Spotify.",embed:"limited"},
"ChatGPT":{url:"https://chatgpt.com/",emoji:"✳",cls:"gpt",icon:"✳",text:"Open ChatGPT to chat with AI and create things.",note:"The full ChatGPT website blocks being embedded in many third-party pages. This launcher opens the official site.",embed:"no"},
"TikTok":{url:"https://www.tiktok.com/",emoji:"♪",cls:"tt",icon:"♪",text:"Explore short videos, creators, and trends.",note:"Some public TikTok videos can be embedded, but the complete TikTok app cannot run inside this launcher.",embed:"limited"},
"Roblox":{url:"https://www.roblox.com/",emoji:"◇",cls:"rb",icon:"◇",text:"Explore Roblox experiences and your account.",note:"This page cannot run the full Roblox game client. Playable experiences require Roblox's supported app/client or official supported web features.",embed:"no"},
"Facebook":{url:"https://www.facebook.com/",emoji:"f",cls:"fb",icon:"f",text:"Open Facebook to view your feed and connect.",note:"Facebook generally blocks its full site from third-party frames. Some public posts or videos may have official embeds.",embed:"no"},
"Instagram":{url:"https://www.instagram.com/",emoji:"◎",cls:"ig",icon:"◎",text:"Open Instagram to see posts, stories, and Reels.",note:"Instagram supports embeds for some public posts and Reels, not the complete interactive app.",embed:"limited"},
"Google":{url:"https://www.google.com/",emoji:"G",cls:"google",icon:"G",text:"Search the web or open Google services.",note:"Google Search blocks being displayed in many third-party frames. Use Open ↗ to search on the official site.",embed:"no"}
};
let current="YouTube";
const overlay=document.getElementById("overlay"),modalIcon=document.getElementById("modalIcon");
function openApp(name){const a=apps[name];if(!a)return;current=name;modalIcon.className="icon "+a.cls;modalIcon.textContent=a.icon;document.getElementById("modalTitle").textContent=name;document.getElementById("infoEmoji").textContent=a.emoji;document.getElementById("infoTitle").textContent=name+" is ready";document.getElementById("infoText").textContent=a.text;document.getElementById("infoNote").textContent=a.note;document.getElementById("launch").textContent="Open "+name+" ↗";overlay.classList.add("open")}
function closeApp(){overlay.classList.remove("open")}
document.querySelectorAll("[data-app]").forEach(b=>b.addEventListener("click",()=>openApp(b.dataset.app)));
document.querySelectorAll("[data-dock]").forEach(b=>b.addEventListener("click",()=>openApp(b.dataset.dock)));
document.getElementById("back").addEventListener("click",closeApp);
overlay.addEventListener("click",e=>{if(e.target===overlay)closeApp()});
document.getElementById("launch").addEventListener("click",()=>{const a=apps[current];if(a)window.open(a.url,"_blank","noopener,noreferrer")});
document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.toLowerCase();let n=0;document.querySelectorAll(".app[data-app]").forEach(b=>{const show=(b.dataset.name+" "+b.dataset.app).toLowerCase().includes(q);b.style.display=show?"flex":"none";if(show)n++});document.getElementById("appTotal").textContent=n+" app"+(n===1?"":"s")});
function tick(){const d=new Date();document.getElementById("statusTime").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});document.getElementById("bigTime").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});document.getElementById("date").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}
tick();setInterval(tick,1000);

// Browser APIs expose only limited device information. Never fake a battery reading.
async function updateBattery(){
 const pill=document.getElementById("batteryPill");
 if(!("getBattery" in navigator)){pill.textContent="▰ --%";pill.title="Battery percentage is not supported by this browser";return}
 try{
  const battery=await navigator.getBattery();
  const render=()=>{pill.textContent=(battery.charging?"⚡ ":"▰ ")+Math.round(battery.level*100)+"%";pill.title=(battery.charging?"Charging · ":"Battery · ")+Math.round(battery.level*100)+"%"};
  render();battery.addEventListener("levelchange",render);battery.addEventListener("chargingchange",render);
 }catch(e){pill.textContent="▰ --%";pill.title="Battery information unavailable"}
}
function updateNetwork(){
 const icon=document.getElementById("wifiIcon");
 if(!navigator.onLine){icon.textContent="○ Offline";icon.title="Browser reports no network connection"}
 else {icon.textContent="◉ Online";icon.title="Online; browser cannot reliably identify Wi-Fi vs mobile data or Wi-Fi signal strength"}
}
window.addEventListener("online",updateNetwork);window.addEventListener("offline",updateNetwork);updateBattery();updateNetwork();
</script>
</body>
</html>
